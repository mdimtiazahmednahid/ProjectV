<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FB Contest Scraper</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      background: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #60a5fa;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .like { background: #1d4ed8; }
    .comment { background: #7e22ce; }
    .share { background: #15803d; }
    .stop { background: #dc2626; }
    .copy { background: #0284c7; }
    .counts {
      background: #1f2937;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>🎯 FB Contest Scraper</h3>
  <button id="btn-like" class="btn like">1. Auto-Scrape Likes 👍</button>
  <button id="btn-comment" class="btn comment">2. Auto-Scrape Comments 💬</button>
  <button id="btn-share" class="btn share">3. Auto-Scrape Shares 🔄</button>
  <button id="btn-stop" class="btn stop">⏹ Stop & Send Batch</button>
  <button id="btn-copy" class="btn copy">📋 Copy All to Desktop App</button>
  <div id="counts" class="counts">👍 0 | 💬 0 | 🔄 0</div>
  <script src="popup.js"></script>
</body>
</html>
